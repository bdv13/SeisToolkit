[project]
name = "seistoolkit"
version = "0.1.0"
description = "Seismic processing toolkit"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "pyproj",
    "shapely",
    "geopandas",
    "pyogrio",
    "obspy",
    "numba>=0.66.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/seistoolkit"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-vv",
    "-p",
    "no:cacheprovider",
]


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "geopandas.*",
    "shapely.*",
    "scipy.*",
    "tqdm.*",
    "obspy.*",
]
ignore_missing_imports = true


[tool.ruff]
target-version = "py314"
line-length = 79


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (PEP 8 style checks)
    "F",  # pyflakes (logical errors, unused imports, undefined names)
    "I",  # import sorting
]


[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
